name: CI

on:
  push:
    branches: ["main", "ci/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov=lifeverse --cov-report=term-missing
      - name: Migration smoke test
        run: alembic upgrade head
      - name: Container build
        run: docker build -t lifeverse-ci .
