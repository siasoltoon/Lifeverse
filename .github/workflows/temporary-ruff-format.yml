name: Temporary Ruff Formatter

on:
  push:
    branches:
      - feature/phases-16-25

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phases-16-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install "ruff>=0.11,<1"
      - run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format phases 16-25 implementation"
          git push origin HEAD:feature/phases-16-25

# formatter trigger
