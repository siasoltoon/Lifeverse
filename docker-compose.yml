services:
  api:
    build: .
    command: uvicorn lifeverse.api:app --host 0.0.0.0 --port 8000
    environment:
      LIFEVERSE_DATABASE_URL: sqlite:////data/lifeverse.db
      LIFEVERSE_ENVIRONMENT: production
    volumes:
      - lifeverse-data:/data
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python -m lifeverse.worker
    environment:
      LIFEVERSE_DATABASE_URL: sqlite:////data/lifeverse.db
      LIFEVERSE_ENVIRONMENT: production
    volumes:
      - lifeverse-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      LIFEVERSE_DATABASE_URL: sqlite:////data/lifeverse.db
    volumes:
      - lifeverse-data:/data

volumes:
  lifeverse-data:
