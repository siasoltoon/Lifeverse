global:
  resolve_timeout: 5m

route:
  receiver: lifeverse-webhook
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: lifeverse-webhook
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        timeout: 10s
