[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"

[project]
name="lifeverse"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.34,<1","pydantic-settings>=2.8,<3","sqlalchemy>=2.0.40,<3","alembic>=1.15,<2"]

[project.optional-dependencies]
dev=["pytest>=8.3,<9","pytest-cov>=6,<7","httpx>=0.28,<1","ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages=["src/lifeverse"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q --strict-config --strict-markers"

[tool.ruff]
line-length=100
target-version="py312"

[tool.ruff.lint]
select=["E","F","I","B","UP"]
ignore=["I001","B008"]

[tool.ruff.format]
quote-style="double"
